name: Prepare GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify staged payload
        shell: bash
        run: |
          set -euo pipefail
          cat .payload/part* | base64 --decode | gzip --decompress > reconstructed.html
          echo "bytes=$(wc -c < reconstructed.html)"
          grep -q '<!DOCTYPE html>' reconstructed.html
          grep -q '絵教材 Presenter' reconstructed.html

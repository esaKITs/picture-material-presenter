name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify public site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cat \
            .payload/part00 .payload/part01 .payload/part02 .payload/part03 .payload/part04 \
            .payload/part05 .payload/part06 .payload/part07 .payload/part08 .payload/part09 \
            .payload_fix/p10_00 .payload_fix/p10_01 .payload_fix/p10_02 .payload_fix/p10_03 .payload_fix/p10_04 .payload_fix/p10_05 \
            .payload_fix/p11_00 .payload_fix/p11_01 .payload_fix/p11_02 .payload_fix/p11_03 \
            | base64 --decode | gzip --decompress > /tmp/a5-site.tar
          echo "ad5cb68620d61ea5860013a0e0d16006edf67038358d32d2ab91b86df67c4622  /tmp/a5-site.tar" | sha256sum --check --strict
          tar -xf /tmp/a5-site.tar -C _site
          test -f _site/index.html
          test -f _site/app/loader.js
          test -f _site/app/styles.css
          test -f _site/demo_beta/beta_lesson_list.csv
          grep -q 'esaKITs A-5 絵教材 Presenter' _site/index.html
          grep -q 'app/loader.js' _site/index.html
          grep -q 'devoice-target' _site/app/styles.css

          cat > _site/app/menu-fix.js <<'EOF'
          (()=>{
            function bindPanelMenu(){
              const oldMenu=document.getElementById('menuBtn');
              const panel=document.getElementById('sidePanel');
              const scrim=document.getElementById('panelScrim');
              if(!oldMenu||!panel)return false;
              const menu=oldMenu.cloneNode(true);
              oldMenu.replaceWith(menu);
              const setOpen=(open)=>{
                panel.classList.toggle('open',open);
                scrim?.classList.toggle('show',open);
                menu.setAttribute('aria-expanded',open?'true':'false');
                if(open){
                  let tab='materials';
                  try{tab=localStorage.getItem('a5.panelTab')||'materials'}catch(e){}
                  if(tab==='answer')tab='content';
                  try{window.a5ShowPanelTab?.(tab,false)}catch(e){}
                }
              };
              menu.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();setOpen(!panel.classList.contains('open'))});
              menu.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setOpen(!panel.classList.contains('open'))}});
              const close=document.getElementById('panelCloseBtn');
              if(close)close.onclick=e=>{e.preventDefault();e.stopPropagation();setOpen(false)};
              if(scrim)scrim.onclick=e=>{e.preventDefault();e.stopPropagation();setOpen(false)};
              menu.setAttribute('aria-controls','sidePanel');
              menu.setAttribute('aria-expanded',panel.classList.contains('open')?'true':'false');
              return true;
            }
            let tries=0;
            const timer=setInterval(()=>{
              tries++;
              if((typeof window.setPanel==='function'||window.a5ShowPanelTab)&&bindPanelMenu())clearInterval(timer);
              else if(tries>200){clearInterval(timer);bindPanelMenu()}
            },50);
          })();
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="app/menu-fix.js?v=1"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'</body>')
          p.write_text(s,encoding='utf-8')
          PY

          test -f _site/app/menu-fix.js
          grep -q 'app/menu-fix.js?v=1' _site/index.html
          grep -q 'bindPanelMenu' _site/app/menu-fix.js
          echo "site_files=$(find _site -type f | wc -l)"
          echo "index_bytes=$(wc -c < _site/index.html)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
